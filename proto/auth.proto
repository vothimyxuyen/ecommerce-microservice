syntax = "proto3";

package ecommerce.auth.v1;

service AuthService {
  rpc Register(RegisterRequest) returns (RegisterReply);
  rpc Login(LoginRequest) returns (LoginReply);
  rpc DeleteUser(DeleteUserRequest) returns (Empty);
  rpc Health(Empty) returns (HealthReply);
}

message Empty {}

message HealthReply {
  string status = 1;
}

message RegisterRequest {
  string username = 1;
  string password = 2;
  string email = 3;
  string phone = 4;
  string role = 5;
}

message RegisterReply {
  int32 uid = 1;
  string username = 2;
  string role = 3;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginReply {
  string access_token = 1;
  string token_type = 2;
  int32 expires_in = 3;
  int32 uid = 4;
  string role = 5;
}

message DeleteUserRequest {
  int32 uid = 1;
}
